        it does not itself remove anything from S3 or Glacier.

        The Registry checks a number of preconditions first, including that
        the deletion was requested and approved and that no conflicting work
        items are pending.
      tags:
        - Intellectual Objects
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
