          description: The name of the institution that owns the files or objects to which this work item pertains.
        institution_identifier:
          type: string
          description: The identifier (domain name) of the institution that owns the files or objects to which this work item pertains.
        inst_approver:
          type: string
          format: email
          description: The email address of the institutional admin who approved a deletion request.
          nullable: true
        intellectual_object_id:
          type: integer
          format: int64
          description: The ID of the IntellectualObject being worked on. This will be null for ingest work items where the ingest is not yet complete.
          nullable: true
        internal_sender_identifier:
          type: string
          description: An optional identifier for internal use by the depositor.
          nullable: true
        name:
          type: string
          description: The name of the original tar file uploaded to the receiving bucket for ingest.
          nullable: false
        needs_admin_review:
          type: boolean
          description: Indicates whether an APTrust admin needs to review and possibly requeue this item. This flag is set after an item encounters too many transient errors.
        node:
          type: string
          description: The hostname of the microservice worker currently processing this item.
          nullable: true
        note:
          type: string
          description: A brief summary of the status of this item.
          nullable: false
        object_identifier:
          type: string
          description: A unique identifier for this object in the format <instution_identifier>/<bag_name>.
          nullable: true
        outcome:
          type: string
          description: The outcome of this item's activity.
          enum: ["Failure", "Success"]
        pid:
          type: integer
          format: int64
          description: The process ID of the worker that is currently working on this item.
        queued_at:
          type: string
          format: date-time
          description: The date and time this item was queued for processing.
          nullable: true
        retry:
          type: boolean
          description: Indicates whether APTrust worker process should continue trying to process this work item. This is set to false only after certain fatal errors, or after too many transient errors.
        size:
          type: integer
          format: int64
          description: The size (in bytes) of the bag, object, or file being worked on.
          nullable: false
        source_organization:
          type: string
          description: The name of the institution that submitted the object for ingest.
        stage:
          type: string
          description: The stage of processing.
          enum:
            - Available in S3
            - Cleanup
            - Copy To Staging
            - Fetch
            - Format Identification
            - Package
            - Receive
            - Record
            - Reingest Check
            - Requested
            - Resolve
            - Restoring
            - Storage Validation
            - Store
            - Unpack
            - Validate
        stage_started_at:
          type: string
          format: date-time
          description: Indicates when the current stage of processing started for this item.
          nullable: true
        status:
          type: string
          description: The status of the current operation.
          enum:
            - Cancelled
            - Failed
            - Pending
            - Started
            - Success
            - Suspended
        storage_option:
          type: string
          description: Indicates where the object's files are stored.
          enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.
        user:
          type: string
          format: email
          description: The email address of the user who initiated this work item.
          nullable: false
    WorkItemViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of items matching your query.
          type: array
          items:
            $ref: '#/components/schemas/WorkItemView'

    # Request schemas. These carry the same properties as the models above,
    # and add the validation rules the Registry enforces on write. See each
    # model's Validate() method in pgmodels for the authoritative rules.

    ChecksumRequest:
      description: |
        A checksum submitted for creation.

        `id`, `created_at` and `updated_at` are assigned by the server and are
        ignored on input. Checksums cannot be updated or deleted once created.
      allOf:
        - $ref: '#/components/schemas/Checksum'
      required:
        - algorithm
        - datetime
        - digest
        - generic_file_id

    GenericFileRequest:
      description: |
        A file submitted for creation or update.

        `id`, `created_at` and `updated_at` are assigned by the server. On
        update, `id` must match the id in the URL.

        `institution_id` must match the `institution_id` in the URL on create,
        and cannot change on update. `identifier` cannot change on update.
        `storage_option` cannot change while the file is active; the Registry
        silently restores the stored value rather than rejecting the request.

        `size` is optional and defaults to 0, but may not be negative.
      allOf:
        - $ref: '#/components/schemas/GenericFile'
      required:
        - file_format
        - identifier
        - institution_id
        - intellectual_object_id
        - state
        - storage_option
        - uuid

    IntellectualObjectRequest:
      description: |
        An object submitted for creation or update.

        `id`, `created_at` and `updated_at` are assigned by the server. On
        update, `id` must match the id in the URL.

        `institution_id` must match the `institution_id` in the URL on create,
        and cannot change on update. `identifier` cannot change on update.
        `storage_option` cannot change while the object is active; the Registry
        silently restores the stored value rather than rejecting the request.
      allOf:
        - $ref: '#/components/schemas/IntellectualObject'
      required:
        - access
        - bagit_profile_identifier
        - identifier
        - institution_id
        - state
        - storage_option
        - title

    PremisEventRequest:
      description: |
        An event submitted for creation.

        **This route does not validate its input.** Unlike every other write
        endpoint in this API, `POST /admin-api/v3/events/create` saves the
        event without calling the model's validation, and the premis_events
        table has no NOT NULL constraints and no foreign keys on
        `institution_id`, `intellectual_object_id` or `generic_file_id`. An
        incomplete or internally inconsistent event will be accepted and
        stored. No properties are therefore marked required here, because the
        server does not require them.

        Callers should nonetheless send a complete event. The same event
        submitted inside `POST /admin-api/v3/files/create_batch/{institution_id}`
        *is* validated, and is rejected unless all of the following hold:

        * `agent`, `detail`, `object`, `outcome_detail` and
          `outcome_information` are non-empty
        * `date_time` is set
        * `event_type` is one of the values in the enum below
        * `outcome` is either Success or Failure
        * `identifier` is a UUID, which the caller generates
        * `institution_id` and `intellectual_object_id` are greater than zero
        * `generic_file_id` is optional, since not every event pertains to a
          file

        `id`, `created_at` and `updated_at` are assigned by the server. Events
        cannot be updated or deleted once created.
      allOf:
        - $ref: '#/components/schemas/PremisEvent'

    StorageRecordRequest:
      description: |
        A storage record submitted for creation.

        `id` is assigned by the server. There is no endpoint for updating or
        deleting a storage record.
      allOf:
        - $ref: '#/components/schemas/StorageRecord'
      required:
        - generic_file_id
        - url

    WorkItemRequest:
      description: |
        A work item submitted for creation or update.

        `id`, `created_at` and `updated_at` are assigned by the server. On
        update, `id` must match the id in the URL, and `institution_id`,
        `intellectual_object_id`, `generic_file_id`, `name`, `etag` and
        `action` cannot change.

        Note that `note` and `outcome` are not currently validated, despite
        appearances: the validator checks the length of `name` in the places
        it means to check those two fields.
      allOf:
        - $ref: '#/components/schemas/WorkItem'
      required:
        - action
        - bag_date
        - bucket
        - date_processed
        - etag
        - institution_id
        - name
        - stage
        - status
        - user

  parameters:
    page:
      name: page
      in: query
      description: The page of results to fetch.
      required: false
      schema:
        type: integer
        default: 1
        format: int32
    perPage:
      name: per_page
      in: query
      description: The number of results to fetch per page.
      required: false
      schema:
        type: integer
        default: 20
        format: int32
    resourceId:
      name: id
      in: path
      required: true
      description: The id of the resource.
      schema:
        type: integer
        format: int64
        minimum: 1
    institutionId:
      name: institution_id
      in: path
      required: true
      description: The id of the institution that owns the resource. This must match the institution_id in the request body.
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: |
        Bad request. Common causes are an unrecognized query string parameter,
        malformed JSON, a resource or institution id in the body that does not
        match the one in the URL, or an attempt to change a field that cannot
        be changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'
    Unauthorized:
      description: Request is not authorized. Be sure you passed valid API credentials with your request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'
    Forbidden:
      description: The current user is not an APTrust system administrator. The entire Admin API is closed to everyone else.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'
    NotFound:
      description: There is no resource with this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'
    Conflict:
      description: The operation conflicts with the current state of the resource. Most often, this means there are pending work items for the object or file.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'
    InternalError:
      description: The Registry encountered an unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestError'

paths:
  /admin-api/v3/alerts:
    get:
      operationId: AlertIndex
      summary: Returns a list of alerts.
      description: |
        Returns all alerts sent to any user at any institution. This endpoint
        is shared with the Member API and returns identical results, except
        that the Member API restricts results to the calling user's own alerts.

        The Admin API does not really need this endpoint, and it may be removed
        in a future release.
      tags:
        - Alerts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include created_at, institution_id, type, and user_id. Defaults to created_at__desc.
          required: false
          schema:
            type: string
            example: created_at__desc
        - name: created_at__gteq
          in: query
          description: Return alerts created on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: created_at__lteq
          in: query
          description: Return alerts created on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: institution_id
          in: query
          description: Return alerts pertaining to the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          description: Return alerts of the specified type.
          required: false
          schema:
            type: string
            enum: ["Deletion Cancelled", "Deletion Completed", "Deletion Confirmed", "Deletion Requested", "Failed Fixity Check", "Password Changed", "Password Reset", "Restoration Completed", "Stalled Work Items", "Welcome New User"]
        - name: user_id
          in: query
          description: Return alerts sent to the specified user.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of alerts matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertViewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/alerts/show/{id}/{user_id}:
    get:
      operationId: AlertShow
      summary: Returns the alert with the specified id, as sent to the specified user.
      description: |
        The alerts table contains one row per alert, but each alert may be sent
        to several recipients. The combination of alert id and recipient user id
        is unique, so both are required here.
      tags:
        - Alerts
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the alert to show.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: user_id
          in: path
          required: true
          description: The id of the user who received the alert.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The requested alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/alerts/generate_failed_fixity_alerts:
    post:
      operationId: GenerateFailedFixityAlerts
      summary: Generates alerts describing recent failed fixity checks.
      description: |
        Queries for fixity check failures that occurred since this process last
        ran, then emails a summary to the institutional admins at each affected
        institution and a single consolidated summary to APTrust admins. It
        records the current timestamp as the new last-run date.

        This is a POST because it creates alert records in the database. It is
        intended to be called once per day by a scheduled job.

        If alert generation fails for one institution, the failure is recorded
        in that institution's summary and processing continues for the others,
        so a 200 or 201 response may still contain per-institution errors.
      tags:
        - Alerts
      responses:
        '200':
          description: No fixity failures were found, so no alerts were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedFixitySummaryList'
        '201':
          description: Alerts were created for one or more institutions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailedFixitySummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Failed fixity alerts have already been generated today. The Registry will not generate them again until tomorrow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin-api/v3/checksums:
    get:
      operationId: ChecksumIndex
      summary: Returns a list of checksums.
      description: This endpoint is shared with the Member API and returns identical results, except that the Member API restricts results to the calling user's own institution.
      tags:
        - Checksums
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include algorithm, datetime, digest, generic_file_id, and id. Defaults to datetime__desc.
          required: false
          schema:
            type: string
            example: datetime__desc
        - name: algorithm
          in: query
          description: Return checksums calculated with the specified algorithm.
          required: false
          schema:
            type: string
            enum: ["md5", "sha1", "sha256", "sha512"]
        - name: datetime__gteq
          in: query
          description: Return checksums calculated on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: datetime__lteq
          in: query
          description: Return checksums calculated on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: digest
          in: query
          description: Return checksums with the specified digest value.
          required: false
          schema:
            type: string
        - name: generic_file_id
          in: query
          description: Return checksums belonging to the specified file.
          required: false
          schema:
            type: integer
            format: int64
        - name: generic_file_identifier
          in: query
          description: Return checksums belonging to the file with the specified identifier.
          required: false
          schema:
            type: string
            example: test.edu/SampleBag/data/document.pdf
        - name: institution_id
          in: query
          description: Return checksums belonging to files owned by the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: intellectual_object_id
          in: query
          description: Return checksums belonging to files of the specified object.
          required: false
          schema:
            type: integer
            format: int64
        - name: state
          in: query
          description: Return checksums whose files are in the specified state. A = Active, D = Deleted.
          required: false
          schema:
            type: string
            enum: ["A", "D"]
      responses:
        '200':
          description: A list of checksums matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecksumViewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/checksums/show/{id}:
    get:
      operationId: ChecksumShow
      summary: Returns the checksum with the specified id.
      tags:
        - Checksums
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the checksum to show.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The checksum with the requested id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecksumView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/checksums/create/{institution_id}:
    post:
      operationId: ChecksumCreate
      summary: Creates a new checksum.
      description: |
        Creates a checksum for an existing file. This is used only when
        ingesting a new version of a previously ingested file. On first ingest,
        checksums are saved as part of the batch transaction in
        `POST /admin-api/v3/files/create_batch/{institution_id}`.

        Checksums cannot be updated or deleted. The Registry keeps every
        checksum ever calculated for a file so that fixity history is complete.
        Submitting a checksum with a non-zero `id` returns 405, because that
        would be an update.
      tags:
        - Checksums
      parameters:
        - $ref: '#/components/parameters/institutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecksumRequest'
      responses:
        '201':
          description: The newly created checksum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checksum'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no generic file with the specified generic_file_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '405':
          description: The submitted checksum has a non-zero id. Checksums cannot be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/deletions:
    get:
      operationId: DeletionRequestIndex
      summary: Returns a list of deletion requests.
      description: This endpoint is shared with the Member API and returns identical results, except that the Member API restricts results to the calling user's own institution.
      tags:
        - Deletion Requests
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include requested_at, confirmed_at, cancelled_at, institution_id, and id. Defaults to requested_at__desc.
          required: false
          schema:
            type: string
            example: requested_at__desc
        - name: institution_id
          in: query
          description: Return deletion requests belonging to the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: requested_at__gteq
          in: query
          description: Return deletion requests made on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: requested_at__lteq
          in: query
          description: Return deletion requests made on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: stage
          in: query
          deprecated: true
          description: |
            **Do not use.** The Registry's filter validator accepts this
            parameter, but the underlying database view has no stage column, so
            the query fails and the request returns a 500.
          required: false
          schema:
            type: string
        - name: status
          in: query
          deprecated: true
          description: |
            **Do not use.** The Registry's filter validator accepts this
            parameter, but the underlying database view has no status column,
            so the query fails and the request returns a 500.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of deletion requests matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestViewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin-api/v3/deletions/show/{id}:
    get:
      operationId: DeletionRequestShow
      summary: Returns the deletion request with the specified id.
      description: |
        Note that this returns a different shape from the Member API's endpoint
        of the same name. The Member API returns a DeletionRequestView, which is
        a flattened summary. This returns the deletion request itself, including
        the full list of files or objects to be deleted and abbreviated records
        for the users who requested, approved or cancelled it.

        This is a read-only view. Deletion requests are initiated, approved and
        cancelled through the Registry's web interface, or, for batches, through
        `POST /admin-api/v3/objects/init_batch_delete`.
      tags:
        - Deletion Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the deletion request to show.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The deletion request with the requested id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestMin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/files:
    get:
      operationId: GenericFileIndex
      summary: Returns a list of files.
      description: |
        **This differs from the Member API endpoint of the same name.** The
        Member API returns flattened GenericFileView records. This returns full
        GenericFile records with their checksums, premis events and storage
        records embedded, because the preservation services workers depend on
        those related records.

        Because each result carries its related records, responses from this
        endpoint can be very large. Use a small per_page value.
      tags:
        - Generic Files
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include created_at, identifier, intellectual_object_id, last_fixity_check, size, state, storage_option, updated_at, and uuid. Defaults to updated_at__desc.
          required: false
          schema:
            type: string
            example: updated_at__desc
        - name: identifier
          in: query
          description: Return the file with this identifier.
          required: false
          schema:
            type: string
            example: test.edu/SampleBag/data/document.pdf
        - name: uuid
          in: query
          description: Return the file with this UUID. The UUID is the file's key name in preservation storage.
          required: false
          schema:
            type: string
            format: uuid
        - name: intellectual_object_id
          in: query
          description: Return files belonging to the specified intellectual object.
          required: false
          schema:
            type: integer
            format: int64
        - name: institution_id
          in: query
          description: Return files belonging to the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: state
          in: query
          description: Return files in the specified state. A = Active, D = Deleted.
          required: false
          schema:
            type: string
            enum: ["A", "D"]
        - name: storage_option
          in: query
          description: Return files with the specified storage option.
          required: false
          schema:
            type: string
            enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        - name: storage_option__in
          in: query
          description: Return files with any of the specified storage options. Repeat this parameter once per value.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        - name: size__gteq
          in: query
          description: Return files whose size in bytes is greater than or equal to this value.
          required: false
          schema:
            type: integer
            format: int64
        - name: size__lteq
          in: query
          description: Return files whose size in bytes is less than or equal to this value.
          required: false
          schema:
            type: integer
            format: int64
        - name: created_at__gteq
          in: query
          description: Return files created on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: created_at__lteq
          in: query
          description: Return files created on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_at__gteq
          in: query
          description: Return files updated on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_at__lteq
          in: query
          description: Return files updated on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: last_fixity_check__gteq
          in: query
          description: Return files whose last fixity check was on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: last_fixity_check__lteq
          in: query
          description: Return files whose last fixity check was on or before the given timestamp. This is how the fixity check workers find files due for checking.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A list of files matching your query, each with its checksums, premis events and storage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/files/show/{id}:
    get:
      operationId: GenericFileShow
      summary: Returns the file with the specified id or identifier.
      description: |
        This endpoint is shared with the Member API and returns identical
        results. The returned file includes its checksums, premis events and
        storage records, with events and checksums ordered newest first.
      tags:
        - Generic Files
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The numeric id of the file, or its semantic identifier in the form
            <institution_identifier>/<bag_name>/<path_in_bag>. Identifiers
            contain slashes and are passed unencoded, so this path segment may
            span several URL segments.
          schema:
            type: string
          examples:
            numericId:
              summary: By numeric id
              value: "42"
            identifier:
              summary: By file identifier
              value: test.edu/SampleBag/data/document.pdf
      responses:
        '200':
          description: The requested file, with its checksums, premis events and storage records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/files/create/{institution_id}:
    post:
      operationId: GenericFileCreate
      summary: Creates a new file record.
      description: |
        Creates a single GenericFile. To create a file along with its checksums,
        premis events and storage records in one transaction, use
        `POST /admin-api/v3/files/create_batch/{institution_id}` instead.
      tags:
        - Generic Files
      parameters:
        - $ref: '#/components/parameters/institutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericFileRequest'
      responses:
        '201':
          description: The newly created file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/files/create_batch/{institution_id}:
    post:
      operationId: GenericFileCreateBatch
      summary: Creates a batch of new files and their related records.
      description: |
        Creates a batch of GenericFiles along with their premis events,
        checksums and storage records, in a single database transaction. This
        is how preservation services records the results of an ingest.

        Every file in the batch must be new. This endpoint will not update
        existing records. Every file's `institution_id` must match the
        `institution_id` in the URL, or the whole batch is rejected.

        Note that the response is a list wrapper, but its `next` and `previous`
        properties are always empty and `count` is simply the number of files
        created.
      tags:
        - Generic Files
      parameters:
        - $ref: '#/components/parameters/institutionId'
      requestBody:
        required: true
        description: An array of GenericFile records, each with its checksums, premis events and storage records.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GenericFileRequest'
      responses:
        '201':
          description: The newly created files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFileList'
        '400':
          description: Bad request. In addition to the usual causes, this is returned when any file in the batch has an institution_id that does not match the one in the URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/files/update/{id}:
    put:
      operationId: GenericFileUpdate
      summary: Updates an existing file record.
      description: |
        Note that the Registry silently forces `storage_option` back to the
        stored value when the existing file is active, because the storage
        option of an active file cannot be changed. The `identifier` and
        `institution_id` of an existing file cannot be changed at all;
        attempting to change either returns a 400.
      tags:
        - Generic Files
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericFileRequest'
      responses:
        '200':
          description: The updated file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/files/delete/{id}:
    delete:
      operationId: GenericFileDelete
      summary: Marks a file record as deleted.
      description: |
        Sets the file's state to D and creates a deletion premis event. This
        records a deletion that has already happened in preservation storage;
        it does not itself remove anything from S3 or Glacier.

        The Registry checks a number of preconditions first. Most importantly,
        there must be an approved deletion request and a completed deletion
        work item for this file. Deletion fails if other work items for the
        file are still pending.
      tags:
        - Generic Files
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: The deleted file record, with state set to D.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin-api/v3/institutions:
