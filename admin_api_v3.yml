          description: The deleted object record, with state set to D.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntellectualObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin-api/v3/objects/init_restore/{id}:
    post:
      operationId: IntellectualObjectInitRestore
      summary: Creates a restoration request for an object.
      description: |
        Creates and queues a WorkItem to restore the object. Restoration can
        take seconds or hours depending on the object's size and where it is
        stored; Glacier and Glacier Deep Archive objects must be moved to S3
        before they can be restored.

        This endpoint takes no request body.
      tags:
        - Intellectual Objects
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '201':
          description: The newly created restoration work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin-api/v3/objects/init_batch_delete:
    post:
      operationId: IntellectualObjectInitBatchDelete
      summary: Creates a deletion request for a batch of objects.
      description: |
        Creates a single deletion request covering many objects, and emails the
        institutional admin named in `requestorId` so they can approve or
        cancel it. **Nothing is deleted and nothing is queued until an
        institutional admin approves the request in the web interface.**

        This endpoint carries extra safeguards because of its blast radius:

        * It requires a `secretKey` in the request body that matches the
          Registry's `BatchDeletionKey` configuration setting. If that setting
          is missing or is not a valid UUID, the endpoint refuses all requests.
        * `requestorId` must belong to an admin at the institution named in
          `institutionId`, and every object in `objectIds` must belong to that
          same institution.
        * Every request, accepted or rejected, is written to the Registry log
          with the calling user's email address and IP address.

        The response includes a full object record for every object in the
        batch, so it can be very large.
      tags:
        - Intellectual Objects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectBatchDeleteParams'
      responses:
        '201':
          description: The newly created deletion request, awaiting approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        '400':
          description: Bad request. In addition to the usual causes, this is returned when the secretKey is missing or incorrect, when the requestor is not an admin at the named institution, or when an object in the batch belongs to another institution or is already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The Registry's BatchDeletionKey configuration setting is missing or invalid, so batch deletion is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/events:
    get:
