    User:
      type: object
      description: |
        A full user record. This appears only as an embedded record in the
        batch deletion response, and includes account details such as sign-in
        history and two-factor status. Password hashes, API key hashes, OTP
        secrets and backup codes are never serialized.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The user's display name.
        email:
          type: string
          format: email
          description: The user's email address, which is also their login.
        phone_number:
          type: string
          description: The user's phone number, starting with a country code. Used for SMS two-factor authentication.
          nullable: true
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution this user belongs to.
        role:
          type: string
          description: The user's role.
          enum: ["admin", "institutional_admin", "institutional_user", "none"]
        institution:
          description: The institution this user belongs to. Present only when the user was loaded with its institution relation.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Institution'
        sign_in_count:
          type: integer
          format: int32
          description: The number of times this user has successfully signed in.
        current_sign_in_at:
          type: string
          format: date-time
          description: When the user signed in for their current session.
          nullable: true
        current_sign_in_ip:
          type: string
          description: The IP address the user signed in from for their current session.
          nullable: true
        last_sign_in_at:
          type: string
          format: date-time
          description: When the user signed in for their previous session.
          nullable: true
        last_sign_in_ip:
          type: string
          description: The IP address the user signed in from for their previous session.
          nullable: true
        last_sign_in_with_authy:
          type: string
          format: date-time
          description: When the user last completed a successful Authy sign-in.
          nullable: true
        authy_status:
          type: string
          description: How the user authenticates with Authy, if at all.
          nullable: true
        otp_required_for_login:
          type: boolean
          description: Whether policy requires this user to complete a second authentication factor.
        enabled_two_factor:
          type: boolean
          description: Whether the user has enabled two-factor authentication.
        confirmed_two_factor:
          type: boolean
          description: Whether the system has confirmed the user's phone number or Authy account.
        email_verified:
          type: boolean
          description: Whether the system has verified the user's email address.
        password_changed_at:
          type: string
          format: date-time
          description: When the user last changed their password.
          nullable: true
        reset_password_sent_at:
          type: string
          format: date-time
          description: When a password reset email was last sent to this user.
          nullable: true
        initial_password_updated:
          type: boolean
          description: Whether the user has replaced the random password generated when their account was created.
        force_password_update:
          type: boolean
          description: Whether the user will be forced to change their password on their next visit.
        grace_period:
          type: string
          format: date-time
          description: Legacy field from the old Rails application. Not used.
          nullable: true
        deactivated_at:
          type: string
          format: date-time
          description: When this user was deactivated. Null for active users.
          nullable: true
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.

    UserMin:
      type: object
      description: The minimum information needed to identify a user.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The user's display name.
        email:
          type: string
          format: email
          description: The user's email address.

    WorkItem:
      type: object
      description: |
        A work item as stored in the work_items table. This is the shape used
        for work item create and update, and the shape returned by the create,
        update and restoration endpoints. It differs from WorkItemView, which
        the index and show endpoints return: the view joins in the institution
        and object identifiers, while this model carries only the foreign keys.

        On update, the Registry rejects any change to `id`, `institution_id`,
        `intellectual_object_id`, `generic_file_id`, `name`, `etag`, or
        `action` with a 400 response.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 1000
          description: The name of the original tar file uploaded to the receiving bucket for ingest. Cannot be changed after creation.
        etag:
          type: string
          minLength: 32
          maxLength: 40
          description: The etag of the tar file uploaded for ingest. Cannot be changed after creation.
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns the file or object that is the subject of this work item. This must match the institution_id in the URL, and cannot be changed after creation.
        intellectual_object_id:
          type: integer
          format: int64
          description: The ID of the IntellectualObject being worked on. Null for ingest work items where the ingest is not yet complete. Cannot be changed after creation.
          nullable: true
        generic_file_id:
          type: integer
          format: int64
          description: The ID of the GenericFile this work item pertains to. Null if the work item pertains to an object. Cannot be changed after creation.
          nullable: true
        bucket:
          type: string
          minLength: 1
          maxLength: 1000
          description: The name of the receiving bucket into which the original bag was uploaded for ingest.
        user:
          type: string
          format: email
          description: The email address of the user who initiated this work item.
        note:
          type: string
          description: A brief summary of the status of this item.
        action:
          type: string
          description: The action being performed. Cannot be changed after creation.
          enum: ["Delete", "Restore Object", "Restore File", "Glacier Restore", "Ingest"]
        stage:
          type: string
          description: The stage of processing.
          enum:
            - Available in S3
            - Cleanup
            - Copy To Staging
            - Fetch
            - Format Identification
            - Package
            - Receive
            - Record
            - Reingest Check
            - Requested
            - Resolve
            - Restoring
            - Storage Validation
            - Store
            - Unpack
            - Validate
        status:
          type: string
          description: The status of the current operation.
          enum:
            - Cancelled
            - Failed
            - Pending
            - Started
            - Success
            - Suspended
        outcome:
          type: string
          description: The outcome of this item's activity.
        bag_date:
          type: string
          format: date-time
          description: The date on which the originally submitted bag appeared in the receiving bucket.
        date_processed:
          type: string
          format: date-time
          description: The date and time of last known activity on this work item. This timestamp may change several times during multipart processes such as ingest.
        retry:
          type: boolean
          description: Indicates whether APTrust worker processes should continue trying to process this work item. Set to false only after certain fatal errors, or after too many transient errors.
        node:
          type: string
          description: The hostname of the microservice worker currently processing this item.
          nullable: true
        pid:
          type: integer
          format: int32
          description: The process ID of the worker currently working on this item.
        needs_admin_review:
          type: boolean
          description: Indicates whether an APTrust admin needs to review and possibly requeue this item. Set after an item encounters too many transient errors.
        queued_at:
          type: string
          format: date-time
          description: The date and time this item was queued for processing.
          nullable: true
        size:
          type: integer
          format: int64
          description: The size (in bytes) of the bag, object, or file being worked on.
        stage_started_at:
          type: string
          format: date-time
          description: Indicates when the current stage of processing started for this item.
          nullable: true
        aptrust_approver:
          type: string
          format: email
          description: The email address of the APTrust admin who approved this item. Used only for bulk deletions.
          nullable: true
        inst_approver:
          type: string
          format: email
          description: The email address of the institutional admin who approved a deletion request.
          nullable: true
        deletion_request_id:
          type: integer
          format: int64
          description: The ID of the file or object deletion request related to this item. Null for all actions other than Delete.
          nullable: true
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.

