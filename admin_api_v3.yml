      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include date_time, event_type, outcome, and id. Defaults to date_time__desc.
          required: false
          schema:
            type: string
            example: date_time__desc
        - name: date_time__gteq
          in: query
          description: Return events that occurred on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_time__lteq
          in: query
          description: Return events that occurred on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: event_type
          in: query
          description: Return events of the specified type.
          required: false
          schema:
            type: string
            enum:
              - access assignment
              - creation
              - deletion
              - fixity check
              - identifier assignment
              - ingestion
              - message digest calculation
              - replication
              - validation
        - name: generic_file_id
          in: query
          description: Return events pertaining to the specified file.
          required: false
          schema:
            type: integer
            format: int64
        - name: generic_file_id__is_null
          in: query
          description: When true, return only object-level events, which have no generic file id.
          required: false
          schema:
            type: boolean
        - name: generic_file_identifier
          in: query
          description: Return events pertaining to the file with the specified identifier.
          required: false
          schema:
            type: string
            example: test.edu/SampleBag/data/document.pdf
        - name: identifier
          in: query
          description: Return the event with this identifier, which is a UUID.
          required: false
          schema:
            type: string
            format: uuid
        - name: institution_id
          in: query
          description: Return events pertaining to the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: intellectual_object_id
          in: query
          description: Return events pertaining to the specified object.
          required: false
          schema:
            type: integer
            format: int64
        - name: intellectual_object_identifier
          in: query
          description: Return events pertaining to the object with the specified identifier.
          required: false
          schema:
            type: string
            example: test.edu/SampleBag
        - name: outcome
          in: query
          description: Return events with the specified outcome.
          required: false
          schema:
            type: string
            enum: ["Failure", "Success"]
      responses:
        '200':
          description: A list of events matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremisEventViewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/events/show/{id}:
    get:
      operationId: PremisEventShow
      summary: Returns the premis event with the specified id or identifier.
      description: This endpoint is shared with the Member API and returns identical results.
      tags:
        - Premis Events
      parameters:
        - name: id
          in: path
          required: true
          description: The numeric id of the event, or the event's UUID identifier.
          schema:
            type: string
          examples:
            numericId:
              summary: By numeric id
              value: "42"
            identifier:
              summary: By event UUID
              value: 8a1e4f0e-2f2d-4a3e-9f7b-5c6d7e8f9a0b
      responses:
        '200':
          description: The requested event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremisEventView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/events/create:
    post:
      operationId: PremisEventCreate
      summary: Creates a new premis event.
      description: |
        Premis events are the Registry's audit trail. They cannot be updated or
        deleted once created, and there is no institution id in this URL; the
        event's own `institution_id` determines ownership. Submitting an event
        with a non-zero `id` returns 405, because that would be an update.

        **Unlike the other write endpoints, this one does not validate its
        input.** See the PremisEventRequest schema for what that means and for
        the fields a well-formed event should carry.

        When the submitted event has type "fixity check", the Registry also
        updates the `last_fixity_check` timestamp on the file named in
        `generic_file_id`. This is how the fixity checking workers record their
        progress, so submitting a fixity check event for a nonexistent file id
        returns a 404 even though the event itself was saved.
      tags:
        - Premis Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PremisEventRequest'
      responses:
        '201':
          description: The newly created event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremisEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: A fixity check event named a generic_file_id that does not exist. Note that the event itself has already been saved by the time this check runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '405':
          description: The submitted event has a non-zero id. Premis events cannot be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/storage_records:
    get:
      operationId: StorageRecordIndex
      summary: Returns a list of storage records.
      description: |
        Each storage record points to one copy of a file in preservation
        storage. A file stored under a redundant storage option will have
        several storage records. There is no Member API equivalent of this
        endpoint.
      tags:
        - Storage Records
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns are id, generic_file_id, and url. Defaults to id__desc.
          required: false
          schema:
            type: string
            example: id__desc
        - name: generic_file_id
          in: query
          description: Return storage records for the specified file.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of storage records matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecordList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/storage_records/show/{id}:
    get:
      operationId: StorageRecordShow
      summary: Returns the storage record with the specified id.
      tags:
        - Storage Records
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the storage record to show.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The storage record with the requested id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/storage_records/create/{institution_id}:
    post:
      operationId: StorageRecordCreate
      summary: Creates a new storage record.
      description: |
        Records the location of one copy of a file in preservation storage.
        This is used only when ingesting a new version of a previously ingested
        file. On first ingest, storage records are saved as part of the batch
        transaction in
        `POST /admin-api/v3/files/create_batch/{institution_id}`.

        There is deliberately no endpoint for deleting a storage record. To
        remove one, delete the generic file it belongs to, which runs the full
        set of deletion preconditions.

        Note that despite the name, this endpoint also updates. Submitting a
        storage record with a non-zero `id` updates that existing record rather
        than creating a new one, and still returns 201.
      tags:
        - Storage Records
      parameters:
        - $ref: '#/components/parameters/institutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRecordRequest'
      responses:
        '201':
          description: The newly created storage record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no generic file with the specified generic_file_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/items:
    get:
      operationId: WorkItemIndex
      summary: Returns a list of work items.
      description: This endpoint is shared with the Member API and returns identical results, except that the Member API restricts results to the calling user's own institution.
      tags:
        - Work Items
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          description: Sort the results by the specified column and direction, in the format column__direction, where direction is "asc" or "desc". Sortable columns include date_processed, bag_date, created_at, updated_at, action, stage, status, and size. Defaults to updated_at__desc.
          required: false
          schema:
            type: string
            example: date_processed__desc
        - name: action
          in: query
          description: Return work items with the specified action.
          required: false
          schema:
            type: string
            enum: ["Delete", "Restore Object", "Restore File", "Glacier Restore", "Ingest"]
        - name: action__in
          in: query
          description: Return work items with any of the specified actions. Repeat this parameter once per value.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ["Delete", "Restore Object", "Restore File", "Glacier Restore", "Ingest"]
        - name: alt_identifier
          in: query
          description: Return work items whose object has this alternate identifier.
          required: false
          schema:
            type: string
        - name: bag_date__gteq
          in: query
          description: Return work items whose bag date is on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: bag_date__lteq
          in: query
          description: Return work items whose bag date is on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: bag_group_identifier
          in: query
          description: Return work items whose object has this bag group identifier.
          required: false
          schema:
            type: string
        - name: bagit_profile_identifier
          in: query
          description: Return work items whose object was ingested under the specified BagIt profile.
          required: false
          schema:
            type: string
        - name: bucket
          in: query
          description: Return work items whose bag was uploaded to the specified receiving bucket.
          required: false
          schema:
            type: string
        - name: date_processed__gteq
          in: query
          description: Return work items last processed on or after the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: date_processed__lteq
          in: query
          description: Return work items last processed on or before the given timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: etag
          in: query
          description: Return work items with this etag.
          required: false
          schema:
            type: string
        - name: generic_file_id
          in: query
          description: Return work items pertaining to the specified file.
          required: false
          schema:
            type: integer
            format: int64
        - name: generic_file_id__is_null
          in: query
          description: When true, return only work items that do not pertain to a specific file.
          required: false
          schema:
            type: boolean
        - name: generic_file_identifier
          in: query
          description: Return work items pertaining to the file with the specified identifier.
          required: false
          schema:
            type: string
        - name: institution_id
          in: query
          description: Return work items belonging to the specified institution.
          required: false
          schema:
            type: integer
            format: int64
        - name: intellectual_object_id
          in: query
          description: Return work items pertaining to the specified object.
          required: false
          schema:
            type: integer
            format: int64
        - name: intellectual_object_id__is_null
          in: query
          description: When true, return only work items with no object id. These are usually ingests that have not yet completed.
          required: false
          schema:
            type: boolean
        - name: name
          in: query
          description: Return work items for the tar file with this name.
          required: false
          schema:
            type: string
        - name: needs_admin_review
          in: query
          description: Return work items flagged for APTrust admin review.
          required: false
          schema:
            type: boolean
        - name: node__is_null
          in: query
          description: When true, return only work items that no worker is currently processing.
          required: false
          schema:
            type: boolean
        - name: node__not_null
          in: query
          description: When true, return only work items that a worker is currently processing.
          required: false
          schema:
            type: boolean
        - name: object_identifier
          in: query
          description: Return work items pertaining to the object with the specified identifier.
          required: false
          schema:
            type: string
            example: test.edu/SampleBag
        - name: queued_at__is_null
          in: query
          description: When true, return only work items that have never been queued. This is how the queueing worker finds items to push into NSQ.
          required: false
          schema:
            type: boolean
        - name: queued_at__not_null
          in: query
          description: When true, return only work items that have been queued.
          required: false
          schema:
            type: boolean
        - name: retry
          in: query
          description: Return work items whose retry flag matches this value.
          required: false
          schema:
            type: boolean
        - name: size__gteq
          in: query
          description: Return work items whose size in bytes is greater than or equal to this value.
          required: false
          schema:
            type: integer
            format: int64
        - name: size__lteq
          in: query
          description: Return work items whose size in bytes is less than or equal to this value.
          required: false
          schema:
            type: integer
            format: int64
        - name: stage
          in: query
          description: Return work items at the specified stage.
          required: false
          schema:
            type: string
        - name: stage__in
          in: query
          description: Return work items at any of the specified stages. Repeat this parameter once per value.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Return work items with the specified status.
          required: false
          schema:
            type: string
            enum: ["Cancelled", "Failed", "Pending", "Started", "Success", "Suspended"]
        - name: status__in
          in: query
          description: Return work items with any of the specified statuses. Repeat this parameter once per value.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ["Cancelled", "Failed", "Pending", "Started", "Success", "Suspended"]
        - name: storage_option
          in: query
          description: Return work items whose object uses the specified storage option.
          required: false
          schema:
            type: string
            enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        - name: user
          in: query
          description: Return work items initiated by the user with this email address.
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: A list of work items matching your query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemViewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/items/show/{id}:
    get:
      operationId: WorkItemShow
      summary: Returns the work item with the specified id.
      description: This endpoint is shared with the Member API and returns identical results.
      tags:
        - Work Items
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the work item to show.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The work item with the requested id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/items/create/{institution_id}:
    post:
      operationId: WorkItemCreate
      summary: Creates a new work item.
      tags:
        - Work Items
      parameters:
        - $ref: '#/components/parameters/institutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemRequest'
      responses:
        '201':
          description: The newly created work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin-api/v3/items/update/{id}:
    put:
      operationId: WorkItemUpdate
      summary: Updates an existing work item.
      description: |
        This is the endpoint preservation services calls throughout ingest,
        restoration and deletion to report progress.

        The Registry rejects any change to `id`, `institution_id`,
        `intellectual_object_id`, `generic_file_id`, `name`, `etag`, or
        `action` with a 400 response.
      tags:
        - Work Items
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemRequest'
      responses:
        '200':
          description: The updated work item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/items/requeue/{id}:
    put:
      operationId: WorkItemRequeue
      summary: Requeues a work item to the specified stage.
      description: |
        Resets the work item to the given stage, sets its status to Pending,
        clears its node, outcome and pid, sets retry to true, clears the
        needs_admin_review flag, and pushes the item into the appropriate NSQ
        topic.

        **This endpoint takes a form-encoded body, not JSON.** It is the only
        endpoint in this API that does. The single field is `stage`.

        The NSQ topic is chosen from the item's existing action and the
        requested stage. For Delete, Restore Object, Restore File and Glacier
        Restore items, the topic depends only on the action. For Ingest items,
        the stage must be one of Receive, Validate, Reingest Check,
        Copy To Staging, Format Identification, Store, Storage Validation,
        Record, or Cleanup; any other stage has no ingest topic and returns a
        400.
      tags:
        - Work Items
      parameters:
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - stage
              properties:
                stage:
                  type: string
                  description: The stage to requeue this item to.
                  example: Store
      responses:
        '200':
          description: The item was requeued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '400':
          description: Bad request. Most often this means the item cannot be requeued to the specified stage, because no NSQ topic exists for that combination of action and stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin-api/v3/items/redis_delete/{id}:
    delete:
      operationId: WorkItemRedisDelete
      summary: Deletes a work item's interim processing data from Redis.
      description: |
        Preservation services keeps interim state for in-progress work items in
        Redis. This endpoint clears that state. It does not touch the work item
        record in the Registry's database.

        Use this when a work item's Redis data is stale or corrupt and you want
        the workers to start the item from scratch.
      tags:
        - Work Items
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: The item's Redis data was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The Registry could not delete the item's Redis record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/prepare_file_delete/{id}:
    post:
      operationId: PrepareFileDelete
      summary: Sets up the preconditions for deleting a file. Test builds only.
      deprecated: true
      description: |
        **This endpoint is not available on demo or production.** It is
        compiled into the Registry only in test and integration builds. In all
        other builds the route exists but returns 405 Method Not Allowed.

        In test builds, it creates an approved deletion request and a completed
        deletion work item for the file, so that integration tests can exercise
        `DELETE /admin-api/v3/files/delete/{id}` without going through the
        normal request-and-approve workflow. It is documented here so that
        developers writing integration tests know it exists.
      tags:
        - Test Endpoints
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: The deletion work item created for this file. Test and integration builds only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: This endpoint is not implemented in this build. This is the response you will get on demo and production.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'

  /admin-api/v3/prepare_object_delete/{id}:
    post:
      operationId: PrepareObjectDelete
      summary: Sets up the preconditions for deleting an object. Test builds only.
      deprecated: true
      description: |
        **This endpoint is not available on demo or production.** It is
        compiled into the Registry only in test and integration builds. In all
        other builds the route exists but returns 405 Method Not Allowed.

        In test builds, it creates an approved deletion request and a completed
        deletion work item for the object, so that integration tests can
        exercise `DELETE /admin-api/v3/objects/delete/{id}` without going
        through the normal request-and-approve workflow. It is documented here
        so that developers writing integration tests know it exists.
      tags:
        - Test Endpoints
      parameters:
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          description: The deletion work item created for this object. Test and integration builds only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          description: This endpoint is not implemented in this build. This is the response you will get on demo and production.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
