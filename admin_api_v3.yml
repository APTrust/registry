openapi: 3.0.0

info:
  title: APTrust Registry Admin API
  description: |
    Open API documentation for version 3 of the APTrust Registry Admin API.

    **This is an internal API. It is not a member-facing contract.**

    Access is restricted to APTrust system administrators. Requests to any
    `/admin-api/` route from a non-sysadmin account are rejected with a 403
    before the request ever reaches a handler, regardless of the credentials
    supplied. Depositors should use the
    [Member API](https://docs.aptrust.org/api/) instead.

    The primary consumer of this API is
    [preservation-services](https://github.com/APTrust/preservation-services),
    which uses it to create and update the object, file, checksum, storage
    record, premis event, and work item records produced during ingest,
    restoration, and deletion. Because preservation-services writes nearly all
    of the data in the Registry, the request and response shapes documented
    here are effectively the Registry's write contract, and changing them will
    break ingest.

    Several routes are handled by the same code that serves the Member API and
    return identical responses. Where the two APIs differ for the same route,
    the difference is called out in the endpoint description. The most
    significant difference is `GET /admin-api/v3/files`, which returns full
    GenericFile records with their related checksums, premis events, and
    storage records embedded, rather than the flattened GenericFileView objects
    the Member API returns.

    ### Filtering, sorting and paging

    Index (list) endpoints accept a fixed set of filter parameters, documented
    per endpoint below. The Registry rejects any query string parameter it does
    not recognize with a 400 response rather than silently ignoring it, so the
    parameter lists in this document are exhaustive. Filter names ending in
    `__gteq` and `__lteq` are inclusive range filters, `__in` accepts a
    repeated parameter, `__starts_with` and `__contains` are string matches,
    and `__is_null` / `__not_null` take a boolean.

    All index endpoints accept `page`, `per_page`, and `sort`. The `sort`
    parameter takes the form `column__direction`, where direction is `asc` or
    `desc`.
  version: '3.0.0'
  contact:
    email: "help@aptrust.org"
  license:
    name: BSD 2-Clause "Simplified" License
    url: https://raw.githubusercontent.com/APTrust/registry/master/LICENSE

servers:
  - url: https://demo.aptrust.org
    description: "APTrust demo server. Use this for testing."
  - url: https://repo.aptrust.org
    description: "APTrust production server."

tags:
  - name: Alerts
    description: Alerts generated by the Registry
  - name: Checksums
    description: Checksums calculated at ingest and during file fixity checks
  - name: Deletion Requests
    description: File and object deletion requests
  - name: Generic Files
    description: Create, update, delete and query individual files
  - name: Institutions
    description: Depositing institutions
  - name: Intellectual Objects
    description: Create, update, delete and query objects
  - name: Premis Events
    description: Events pertaining to files and objects
  - name: Storage Records
    description: Locations of file copies in preservation storage
  - name: Work Items
    description: Ingest, deletion, and restoration work items
  - name: Test Endpoints
    description: Endpoints compiled only into test and integration builds

security:
  - apiKey: []
    apiUser: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Pharos-API-Key
      description: The sysadmin user's secret API key
    apiUser:
      type: apiKey
      in: header
      name: X-Pharos-API-User
      description: The sysadmin user's email address

  schemas:
    AlertView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        institution_id:
          type: integer
          format: int64
        institution_name:
          type: string
        institution_identifier:
          type: string
        type:
          type: string
          description: The type of alert.
          enum: ["Deletion Cancelled", "Deletion Completed", "Deletion Confirmed", "Deletion Requested", "Failed Fixity Check", "Password Changed", "Password Reset", "Restoration Completed", "Stalled Work Items", "Welcome New User"]
        subject:
          type: string
        content:
          type: string
          description: The main body of the alert message.
        deletion_request_id:
          type: integer
          format: int64
          nullable: true
          description: The id of the deletion request, if this alert pertains to a deletion request.
        created_at:
          type: string
          format: date-time
          description: Date and time the alert was generated.
        user_id:
          type: integer
          format: int64
          description: The ID of the user to whom the alert was sent.
        user_name:
          type: string
          description: The name of the user to whom the alert was sent.
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: Date and time this alert was sent to the user. This may be null if the system was unable to send the alert.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: Date and time the recipient read this alert. This will be null if the recipient has not yet viewed the alert, or if the recipient manually set the message to 'unread' in the Web UI.
    AlertViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of alerts matching your query.
          type: array
          items:
            $ref: '#/components/schemas/AlertView'

    Checksum:
      type: object
      properties:
        id:
          type: integer
          format: int64
        algorithm:
          type: string
          enum: ["md5", "sha1", "sha256", "sha512"]
          description: The algorithm used to calculate the digest.
        datetime:
          type: string
          format: date-time
          description: The date and time at which this digest was calculated.
        digest:
          type: string
          description: The checksum.
        generic_file_id:
          type: integer
          format: int64
          description: The unique id of the GenericFile to which this checksum pertains.
    ChecksumView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        algorithm:
          type: string
          enum: ["md5", "sha1", "sha256", "sha512"]
          description: The algorithm used to calculate the digest.
        datetime:
          type: string
          format: date-time
          description: The date and time at which this digest was calculated.
        digest:
          type: string
          description: The checksum.
        state:
          type: string
          enum: ["A", "D"]
          description: The state of the GenericFile to which this checksum pertains. A = Active, D = Deleted
        generic_file_identifier:
          type: string
          description: "The identifier of the GenericFile to which this checksum pertains. GenericFile identifiers follow a semantic format: <instution_identifier>/<bag_name>/<path_in_bag>"
          example: test.edu/SampleBag/data/document.pdf
        generic_file_id:
          type: integer
          format: int64
          description: The unique id of the GenericFile to which this checksum pertains.
        intellectual_object_id:
          type: integer
          format: int64
          description: The ID of the GenericFile's parent object.
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns the GenericFile.
        created_at:
          type: string
          format: date-time
          description: The date and time at which the checksum record was created in the database. This will be later than the datetime field because checksums are calculated early in the ingest process and recorded near the end of ingest.
        updated_at:
          type: string
          format: date-time
          description: Since checksums cannot be updated, this should always match the value of created_at.
    ChecksumViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: An array of ChecksumView objects matching your query.
          type: array
          items:
            $ref: '#/components/schemas/ChecksumView'

    DeletionRequest:
      type: object
      description: |
        A full deletion request record, including the users involved and the
        complete list of files or objects to be deleted. This is returned by
        the batch deletion endpoint. Note that the embedded user records are
        full User objects, not the abbreviated UserMin objects returned by
        `GET /admin-api/v3/deletions/show/{id}`.
      properties:
        id:
          type: integer
          format: int64
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns the files or objects to be deleted.
        requested_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was requested.
        confirmed_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was approved. Null until an institutional admin approves the request.
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was cancelled (rejected).
          nullable: true
        requested_by:
          description: The user who requested the deletion.
          allOf:
            - $ref: '#/components/schemas/User'
        confirmed_by:
          description: The user who confirmed (approved) the deletion. Null until approved.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'
        cancelled_by:
          description: The user who cancelled (rejected) the deletion.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/User'
        generic_files:
          type: array
          description: The files to be deleted. Empty for object deletion requests.
          items:
            $ref: '#/components/schemas/GenericFile'
        intellectual_objects:
          type: array
          description: The objects to be deleted. Empty for file deletion requests.
          items:
            $ref: '#/components/schemas/IntellectualObject'
        work_item:
          type: array
          description: "The work items associated with this deletion request. Note that despite the singular property name, this is an array."
          items:
            $ref: '#/components/schemas/WorkItem'

    DeletionRequestMin:
      type: object
      description: |
        An abbreviated deletion request record. The users attached to the
        request are reduced to id, name and email, and no work items are
        included.
      properties:
        id:
          type: integer
          format: int64
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns the files or objects to be deleted.
        requested_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was requested.
        confirmed_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was approved.
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was cancelled (rejected).
          nullable: true
        requested_by:
          description: The user who requested the deletion.
          allOf:
            - $ref: '#/components/schemas/UserMin'
        confirmed_by:
          description: The user who confirmed (approved) the deletion. Null until approved.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserMin'
        cancelled_by:
          description: The user who cancelled (rejected) the deletion.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserMin'
        generic_files:
          type: array
          description: The files to be deleted. Empty for object deletion requests.
          items:
            $ref: '#/components/schemas/GenericFile'
        intellectual_objects:
          type: array
          description: The objects to be deleted. Empty for file deletion requests.
          items:
            $ref: '#/components/schemas/IntellectualObject'

    DeletionRequestView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns the files or objects to which this deletion request pertains.
        institution_name:
          type: string
          description: The name of the institution that owns the files or objects to which this deletion request pertains.
        institution_identifier:
          type: string
          description: The identifier (domain name) of the institution that owns the files or objects to which this deletion request pertains.
        requested_by_id:
          type: integer
          format: int64
          description: The id of the user who requested the deletion.
        requested_by_name:
          type: string
          description: The name of the user who requested this deletion.
        requested_by_email:
          type: string
          description: The email address of the user who requested this deletion.
          format: email
        requested_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was requested.
        confirmed_by_id:
          type: integer
          format: int64
          description: The id of the user who confirmed (approved) this deletion. This will be null if the deletion has not yet been approved or was cancelled.
          nullable: true
        confirmed_by_name:
          type: string
          description: The name of the user who confirmed (approved) this deletion.
          nullable: true
        confirmed_by_email:
          type: string
          description: The email address of the user who confirmed (approved) this deletion.
          format: email
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was approved.
          nullable: true
        cancelled_by_id:
          type: integer
          format: int64
          description: The id of the user who cancelled (rejected) this deletion.
          nullable: true
        cancelled_by_name:
          type: string
          description: The name of the user who cancelled (rejected) this deletion.
          nullable: true
        cancelled_by_email:
          type: string
          description: The email address of the user who cancelled (rejected) this deletion.
          format: email
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          description: The date and time at which this deletion was cancelled (rejected).
          nullable: true
        file_count:
          type: integer
          format: int64
          description: The total number of files to be deleted in this request. If zero, this is an object deletion request.
          minimum: 0
        object_count:
          type: integer
          format: int64
          description: The total number of objects to be deleted in this request. If zero, this is a file deletion request.
          minimum: 0
        status:
          type: string
          description: The status of the deletion request.
          enum: ["Approved", "Awaiting Approval", "Rejected"]
          nullable: true
    DeletionRequestViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of deletion requests matching your query.
          type: array
          items:
            $ref: '#/components/schemas/DeletionRequestView'

    FailedFixitySummary:
      type: object
      description: A summary of failed fixity checks at a single institution.
      properties:
        failures:
          type: integer
          format: int64
          description: The number of failed fixity checks at this institution since the alerts were last generated.
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution whose files failed fixity checks.
        institution_name:
          type: string
          description: The name of the institution whose files failed fixity checks.
        error:
          type: string
          description: If alert generation failed for this institution, this describes the failure. Alert generation continues for other institutions when one fails.
          nullable: true

    FailedFixitySummaryList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of failed fixity checks across all institutions in this report.
        next:
          type: string
          description: Not used by this endpoint. Always empty.
        previous:
          type: string
          description: Not used by this endpoint. Always empty.
        results:
          description: One summary per institution with failed fixity checks.
          type: array
          items:
            $ref: '#/components/schemas/FailedFixitySummary'

    GenericFile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        file_format:
          type: string
          description: The mime type of the file.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The size (in bytes) of the file.
        identifier:
          type: string
          description: The file's semantic identifier in the format <instution_identifier>/<bag_name>/<path_in_bag>.
        intellectual_object_id:
          type: integer
          format: int64
          description: The ID of the IntellectualObject to which this file belongs.
        state:
          type: string
          description: Indicates whether the file is Active (A) or Deleted (D).
          enum: ["A", "D"]
        last_fixity_check:
          type: string
          format: date-time
          description: The date and time of this file's last fixity check.
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns this file.
        storage_option:
          type: string
          description: Indicates where the file is stored.
          enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        uuid:
          type: string
          format: uuid
          description: The file's unique identifier in preserveration storage. This is its S3/Glacier key name.
        premis_events:
          description: Premis events pertaining to this file.
          type: array
          items:
            $ref: '#/components/schemas/PremisEvent'
        checksums:
          description: A list of checksums for this file.
          type: array
          items:
            $ref: '#/components/schemas/Checksum'
        storage_records:
          description: A list of storage records for this file. Each record points to a copy of this file in a preservation storage bucket.
          type: array
          items:
            $ref: '#/components/schemas/StorageRecord'
        created_at:
          type: string
          format: date-time
          description: The date and time at which the generic file record was created. This indicates the date of initial ingest.
        updated_at:
          type: string
          format: date-time
          description: The date and time at which the generic file was last updated. Updates may indicate re-ingest or changes to last fixity check date.
        mtime:
          type: string
          format: date-time
          description: The file's last modified time as recorded in the bag's tag manifest. Not documented in the Member API, but present in the JSON.
          nullable: true

    GenericFileList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of files matching your query, each including its checksums, premis events and storage records.
          type: array
          items:
            $ref: '#/components/schemas/GenericFile'

    Institution:
      type: object
      description: A depositing institution, as stored in the institutions table.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The institution's display name.
        identifier:
          type: string
          description: The institution's unique identifier, which is its domain name.
          example: test.edu
        state:
          type: string
          description: Indicates whether the institution is Active (A) or Deleted (D).
          enum: ["A", "D"]
        type:
          type: string
          description: Indicates whether this is a member institution (account) or a subscribing institution (sub-account).
          enum: ["MemberInstitution", "SubscriptionInstitution"]
        member_institution_id:
          type: integer
          format: int64
          description: The ID of this institution's parent. Applicable to subscribing institutions (sub-accounts) only.
          nullable: true
        deactivated_at:
          type: string
          format: date-time
          description: The date and time at which this institution was deactivated. Null for active institutions.
          nullable: true
        otp_enabled:
          type: boolean
          description: Indicates whether two-factor authentication is required for all users at this institution.
        spot_restore_frequency:
          type: integer
          format: int64
          description: How often, in days, the Registry should queue an automated spot restoration for this institution. Zero means never.
        last_spot_restore_work_item_id:
          type: integer
          format: int64
          description: The ID of the work item for this institution's most recent spot restoration.
          nullable: true
        receiving_bucket:
          type: string
          description: The name of the S3 bucket into which this institution uploads bags for ingest.
        restore_bucket:
          type: string
          description: The name of the S3 bucket into which the Registry restores this institution's objects and files.
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.

    InstitutionView:
      type: object
      description: |
        An institution record with its parent institution's details joined in.
        Subscribing institutions (sub-accounts) have a parent; member
        institutions do not, and their parent fields will be empty.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The institution's display name.
        identifier:
          type: string
          description: The institution's unique identifier, which is its domain name.
          example: test.edu
        state:
          type: string
          description: Indicates whether the institution is Active (A) or Deleted (D).
          enum: ["A", "D"]
        type:
          type: string
          description: Indicates whether this is a member institution (account) or a subscribing institution (sub-account).
          enum: ["MemberInstitution", "SubscriptionInstitution"]
        deactivated_at:
          type: string
          format: date-time
          description: The date and time at which this institution was deactivated. Null for active institutions.
          nullable: true
        otp_enabled:
          type: boolean
          description: Indicates whether two-factor authentication is required for all users at this institution.
        spot_restore_frequency:
          type: integer
          format: int64
          description: How often, in days, the Registry should queue an automated spot restoration for this institution. Zero means never.
        last_spot_restore_work_item_id:
          type: integer
          format: int64
          description: The ID of the work item for this institution's most recent spot restoration.
          nullable: true
        receiving_bucket:
          type: string
          description: The name of the S3 bucket into which this institution uploads bags for ingest.
        restore_bucket:
          type: string
          description: The name of the S3 bucket into which the Registry restores this institution's objects and files.
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.
        parent_id:
          type: integer
          format: int64
          description: The ID of this institution's parent. Applicable to subscribing institutions only.
          nullable: true
        parent_name:
          type: string
          description: The display name of this institution's parent.
          nullable: true
        parent_identifier:
          type: string
          description: The identifier (domain name) of this institution's parent.
          nullable: true
        parent_state:
          type: string
          description: Indicates whether the parent institution is Active (A) or Deleted (D).
          enum: ["A", "D"]
          nullable: true
        parent_deactivated_at:
          type: string
          format: date-time
          description: The date and time at which the parent institution was deactivated.
          nullable: true

    InstitutionViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of institutions matching your query.
          type: array
          items:
            $ref: '#/components/schemas/InstitutionView'

    IntellectualObject:
      type: object
      description: |
        An intellectual object as stored in the intellectual_objects table.
        This is the shape used for object create and update, and the shape
        returned by the object create, update and delete endpoints. It differs
        from IntellectualObjectView, which is what the index and show endpoints
        return: the view flattens in the owning institution's details and
        adds derived counts and sizes, while this model carries the related
        records instead.

        The `institution`, `generic_files` and `premis_events` properties are
        populated only when the caller submits them or when the query that
        loaded the object requested those relations. They are typically absent
        from create and update responses.
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: The title should briefly describe the contents of the object.
        description:
          type: string
          description: A more detailed description of the object's contents.
        identifier:
          type: string
          description: A unique identifier for this object in the format <instution_identifier>/<bag_name>. This cannot be changed once the object has been created.
        alt_identifier:
          type: string
          description: An alternate identifier for this object, supplied by the depositor.
          nullable: true
        access:
          type: string
          description: Describes whether this object's metadata can be accessed by the APTrust consortia, by the institution, or only by admins at the institution (restricted). This is a vestigial field. Access settings have never been fully implemented, and all objects are treated as access-level "institution".
          enum: ["consortia", "institution", "restricted"]
        bag_name:
          type: string
          description: The name of the bag when it was uploaded to the depositor's receiving bucket, minus the .tar extention. For example, bag "Photos_1945.tar" will have bag name "Photos_1945".
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns this object. This must match the institution_id in the URL, and it cannot be changed once the object has been created.
        state:
          type: string
          description: Indicates whether the object is Active (A) or Deleted (D).
          enum: ["A", "D"]
        etag:
          type: string
          description: The etag of last ingested version of this object. The etag is assinged by S3 upon upload to the depositor's receiving bucket.
        bag_group_identifier:
          type: string
          description: An optional identifier naming the logical group to which this object belongs. For instance, if ten bags are all part of the same collection, the collection name may be used as the group identifier associating all ten bags.
          nullable: true
        storage_option:
          type: string
          description: |
            Indicates where the object's files are stored. Note that the
            Registry silently forces this value back to the existing object's
            storage option when the existing object is active, because the
            storage option of an active object cannot be changed. See
            https://aptrust.github.io/userguide/bagging/#allowed-storage-option-values
          enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        bagit_profile_identifier:
          type: string
          description: The identifier of the BagIt profile used to create this bag. This can be either the APTrust profile URL or the BTR profile URL. Bags will be restored using the same profile under which they were submitted.
          enum: ["https://github.com/dpscollaborative/btr_bagit_profile/releases/download/1.0/btr-bagit-profile.json", "https://raw.githubusercontent.com/APTrust/preservation-services/master/profiles/aptrust-v2.2.json"]
        source_organization:
          type: string
          description: The name of the institution that submitted the object for ingest.
        internal_sender_identifier:
          type: string
          description: An optional identifier for internal use by the depositor.
          nullable: true
        internal_sender_description:
          type: string
          description: An optional description for use by the depositor.
          nullable: true
        institution:
          description: The institution that owns this object. Present only when the object was loaded with its institution relation.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Institution'
        generic_files:
          type: array
          description: The files belonging to this object. Present only when the object was loaded with its file relation.
          items:
            $ref: '#/components/schemas/GenericFile'
        premis_events:
          type: array
          description: Object-level premis events. Present only when the object was loaded with its event relation.
          items:
            $ref: '#/components/schemas/PremisEvent'
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.

    IntellectualObjectView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: The title should briefly describe the contents of the object.
        description:
          type: string
          description: A more detailed description of the object's contents.
        identifier:
          type: string
          description: A unique identifier for this object in the format <instution_identifier>/<bag_name>.
        alt_identifier:
          type: string
          description: An alternate identifier for this object, supplied by the depositor.
          nullable: true
        access:
          type: string
          description: Describes whether this object's metadata can be accessed by the APTrust consortia, by the institution, or only by admins at the institution (restricted). This is vestigial field. Access settings have never been fully implemented, and all objects are treated as access-level "institution".
          enum: ["consortia", "institution", "restricted"]
        bag_name:
          type: string
          description: The name of the bag when it was uploaded to the depositor's receiving bucket, minus the .tar extention. For example, bag "Photos_1945.tar" will have bag name "Photos_1945".
        institution_id:
          type: integer
          format: int64
          description: The ID of the institution that owns this object.
        created_at:
          type: string
          format: date-time
          description: The date and time this record was created.
        updated_at:
          type: string
          format: date-time
          description: The date and time this record was last updated.
        state:
          type: string
          description: Indicates whether the object is Active (A) or Deleted (D).
          enum: ["A", "D"]
        etag:
          type: string
          description: The etag of last ingested version of this object. The etag is assinged by S3 upon upload to the depositor's receiving bucket.
          nullable: false
        bag_group_identifier:
          type: string
          description: An optional identifier naming the logical group to which this object belongs. For instance, if ten bags are all part of the same collection, the collection name may be used as the group identifier associating all ten bags.
          nullable: true
        storage_option:
          type: string
          description: Indicates where the object's files are stored.
          enum: ["Glacier-Deep-OH", "Glacier-Deep-OR", "Glacier-Deep-VA", "Glacier-OH", "Glacier-OR", "Glacier-VA", "Standard", "Wasabi-OR", "Wasabi-TX", "Wasabi-VA"]
        bagit_profile_identifier:
          type: string
          description: The identifier of the BagIt profile used to create this bag. This can be either the APTrust profile URL or the BTR profile URL. Bags will be restored using the same profile under which they were submitted.
          enum: ["https://github.com/dpscollaborative/btr_bagit_profile/releases/download/1.0/btr-bagit-profile.json", "https://raw.githubusercontent.com/APTrust/preservation-services/master/profiles/aptrust-v2.2.json"]
        source_organization:
          type: string
          description: The name of the institution that submitted the object for ingest.
        internal_sender_identifier:
          type: string
          description: An optional identifier for internal use by the depositor.
          nullable: true
        internal_sender_description:
          type: string
          description: An optional description for use by the depositor.
          nullable: true
        institution_name:
          type: string
          description: Name of the institution that deposited this object.
        institution_identifier:
          type: string
          description: Identifier of the institution that deposited this object.
        institution_type:
          type: string
          description: Indicates whether the institution that owns this object is a member institution (account) or subscribing institution (sub-account).
          enum: ["MemberInstitution", "SubscriptionInstitution"]
        institution_parent_id:
          type: integer
          format: int64
          description: ID of this institution's parent. Applicable to subscriber institutions (sub-accounts) only.
          nullable: true
        file_count:
          type: integer
          format: int64
          description: The total number of files preserved for this object. This includes payload files and preserved manifests. APTrust does not preserve manifests or tag manifests.  This number can change over time as additional new files are ingested or existing ones are deleted.
          nullable: false
        size:
          type: integer
          format: int64
          description: The total number of bytes for all files preserved for this object.  This number can change over time as additional new files are ingested or existing ones are deleted.
        payload_file_count:
          type: integer
          format: int64
          description: The total number of files in this object's payload. I.e., inside the data directory of the bag that was uploaded for deposit. This number can change over time as additional new files are ingested or existing ones are deleted.
          nullable: false
        payload_size:
          type: integer
          format: int64
          description: Total size, in bytes, of the files in this object's payload directory (the data directory of the bag that was uploaded for ingest).  This number can change over time as additional new files are ingested or existing ones are deleted.
          nullable: false
    IntellectualObjectViewList:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: The total number of results matching your query.
        next:
          type: string
          description: The URL for the next page of results.
        previous:
          type: string
          description: The URL for the previous page of results.
        results:
          description: A list of objects matching your query.
          type: array
          items:
            $ref: '#/components/schemas/IntellectualObjectView'

    ObjectBatchDeleteParams:
      type: object
      description: |
        Parameters for a batch object deletion request.

        Note that unlike every other request body in this API, these properties
        are camelCase, not snake_case.
      required:
        - institutionId
        - requestorId
        - objectIds
        - secretKey
      properties:
        institutionId:
          type: integer
          format: int64
          description: The ID of the institution that owns all of the objects to be deleted. Every object in objectIds must belong to this institution.
        requestorId:
          type: integer
          format: int64
          description: The ID of the institutional admin on whose behalf this request is being made. This user must be an admin at the institution named in institutionId.
        objectIds:
          type: array
          description: The IDs of the objects to be deleted.
          items:
            type: integer
            format: int64
        secretKey:
          type: string
          format: uuid
          description: The batch deletion key. This must match the BatchDeletionKey setting in the Registry's configuration. Requests with a missing or incorrect key are rejected.

    PremisEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
